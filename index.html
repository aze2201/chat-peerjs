<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>📡 GroupChat · Auto Voice Mic · Password Protected Rooms</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b1c26; background: radial-gradient(circle at 20% 30%, #1e3a4e, #0e1e26);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 8px;
        }
        .app {
            max-width: 1100px; width: 100%; background: #0e1e26; backdrop-filter: blur(30px);
            border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); padding: 20px 16px;
            border: 1px solid rgba(80,140,180,0.3);
        }
        .header { margin-bottom: 16px; }
        h1 { font-size: 1.9rem; font-weight: 700; color: #e6f7ff; display: flex; align-items: center; gap: 6px; }

        .username-panel {
            background: #142e3a; border-radius: 60px; padding: 12px 20px; margin-bottom: 20px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid #2e6b7c;
        }
        .username-panel label { font-weight: 700; color: #cae9ff; font-size: 1.1rem; }
        #usernameInput {
            flex: 1; min-width: 200px; padding: 14px 22px; border: none; border-radius: 50px;
            font-size: 1.1rem; background: #1d3e4c; color: white; outline: none;
            border: 1.5px solid transparent;
        }
        #usernameInput:focus { border-color: #4ab0d0; background: #15323d; }

        .section { background: #112e38cc; backdrop-filter: blur(8px); border-radius: 36px; padding: 24px 20px; margin-bottom: 20px; border: 1px solid #3c798b; }
        .flex-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
        .btn {
            background: #256579; border: none; color: white; padding: 14px 28px; border-radius: 60px;
            font-weight: 700; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 10px;
            cursor: pointer; border: 1px solid #80d0e0; box-shadow: 0 8px 16px #00000040;
        }
        .btn:hover { background: #34879c; transform: scale(0.97); }
        .btn-danger { background: #b33b2c; }
        .btn-success { background: #2e8b57; }
        .toggle-switch {
            display: inline-flex; align-items: center; gap: 12px; background: #1b4957;
            padding: 12px 24px; border-radius: 60px; cursor: pointer;
        }
        .toggle-switch input { width: 20px; height: 20px; cursor: pointer; }

        .link-box { background: #0d303b; padding: 16px 22px; border-radius: 60px; word-break: break-all; font-size: 1rem; border: 1px solid #4f9db2; display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: #dbf2ff; }
        #customSessionId, #hostPasswordInput { flex:1; padding: 16px 24px; border-radius: 60px; border: none; background: #1b4957; color: white; font-size: 1.1rem; border: 1px solid #30809b; }
        
        .password-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .password-modal-content {
            background: #0e2a33; border-radius: 48px; padding: 32px; max-width: 400px; width: 90%;
            border: 2px solid #4ab0d0; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .password-modal-content h3 { color: #e6f7ff; margin-bottom: 20px; font-size: 1.8rem; }
        .password-modal-content input {
            width: 100%; padding: 16px 20px; border-radius: 60px; border: none;
            background: #1d3e4c; color: white; font-size: 1.1rem; margin-bottom: 20px;
            border: 1px solid #30809b;
        }
        .password-modal-content .btn { width: 100%; justify-content: center; margin-top: 10px; }
        .error-msg { color: #ff8888; margin-top: 12px; text-align: center; }

        .chat-top-bar {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
            background: #0f2e38; border-radius: 60px; padding: 8px 20px; border: 1px solid #358197;
        }
        .left-status {
            display: flex; align-items: center; gap: 12px; background: #10333e; padding: 6px 18px;
            border-radius: 40px; border: 1px solid #3e98ab; color: #d2f0fc; font-size: 0.95rem;
        }
        .my-name-small { font-size: 0.95rem; font-weight: 600; color: #c2ecff; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #708e96; display: inline-block; }
        .dot.active { background: #3ae03a; box-shadow: 0 0 18px #26e626; }
        .dot.voice-active { background: #ffaa44; box-shadow: 0 0 18px #ffaa44; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .three-dot-btn {
            background: #1f5768; border: none; color: white; font-size: 1.8rem; line-height: 1;
            padding: 0 12px; border-radius: 40px; cursor: pointer; border: 1px solid #6ab5c9;
            display: flex; align-items: center; justify-content: center; height: 48px;
        }

        .info-panel {
            background: #0f2f39; border-radius: 28px; padding: 22px; margin-bottom: 20px;
            border: 1px solid #3b98ad; display: none; flex-direction: column; gap: 16px;
        }
        .info-row {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            background: #10333e; padding: 12px 18px; border-radius: 60px; color: #e2f3ff;
            gap: 8px;
        }
        .info-label { font-weight: 600; color: #aae1f0; }
        .room-link-copy { background: #1b5768; padding: 8px 22px; border-radius: 40px; color: white; border: none; font-weight: 600; cursor: pointer; }
        #iceProfileSelectInfo, #voiceBitrateSelect {
            background: #1f5768; color: white; border: none; padding: 12px 24px; border-radius: 50px;
            font-size: 0.95rem; border: 1px solid #6ac8e0; flex: 1; min-width: 160px;
        }
        #retryManualBtnInfo { background: #2e7285; border: none; color: white; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }

        .chat-container {
            background: #0a232b; border-radius: 36px; padding: 20px; margin-top: 8px;
            border: 1px solid #2d7488;
        }
        .messages {
            background: #0b1c22; border-radius: 28px; padding: 22px 16px; 
            height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px;
            border: 1px solid #275f6b;
        }
        .message {
            background: #1e424b; padding: 14px 20px; border-radius: 24px 24px 24px 8px;
            max-width: 85%; word-break: break-word; align-self: flex-start;
            border: 1px solid #4895a8; color: #f0fafc; font-size: 1.05rem;
        }
        .message.self { background: #1f5d6b; align-self: flex-end; border-radius: 24px 24px 8px 24px; border: 1px solid #83d1e0; }
        .message.system { background: transparent; color: #b7e1ed; align-self: center; font-size: 0.95rem; border: 1px dashed #519faf; text-align: center; max-width: 90%; }
        .message.voice-event { background: #2e6b5e33; border: 1px solid #ffaa44; color: #ffdd99; }

        .voice-call-bar {
            background: #10333e; border-radius: 60px; padding: 12px 24px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            border: 1px solid #358197; flex-wrap: wrap;
        }
        .voice-status {
            display: flex; align-items: center; gap: 12px; font-size: 1rem;
            background: #0a2a33; padding: 8px 20px; border-radius: 40px;
        }
        .voice-status span:first-child { color: #bbe6f0; }
        .voice-status .status-badge { font-weight: bold; }
        .voice-controls { display: flex; gap: 12px; flex-wrap: wrap; }
        .voice-btn {
            background: #256579; border: none; color: white; padding: 12px 24px; border-radius: 60px;
            font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; gap: 10px;
            cursor: pointer; border: 1px solid #6ac8e0; transition: all 0.2s;
        }
        .voice-btn.voice-active { background: #2e8b57; box-shadow: 0 0 15px #2e8b57; }
        .voice-btn.end-call { background: #b33b2c; }
        .voice-mute { background: #4a6270; padding: 12px 20px; }
        
        .input-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #0b2c35;
            padding: 8px 12px; border-radius: 60px; border: 1px solid #328296; position: relative;
        }
        #messageInput {
            flex: 1; min-width: 160px; padding: 12px 18px;
            border: none; border-radius: 50px; font-size: 1rem;
            background: #163f49; color: white; outline: none;
            border: 1.5px solid transparent;
        }
        #messageInput:focus { border-color: #71d0e3; }
        #menuBtn {
            background: #1b5768; border: none; color: white; font-size: 1.6rem; line-height: 1;
            padding: 0 14px; border-radius: 40px; cursor: pointer; border: 1px solid #86d6e6;
            display: inline-flex; align-items: center; justify-content: center; height: 48px;
            min-width: 52px;
        }
        #shareMenu {
            display: none; position: absolute; bottom: 70px; right: 10px; background: #0e2f38;
            border-radius: 28px; padding: 14px; border: 1.5px solid #4ba6b9; z-index: 200;
            flex-direction: column; gap: 12px;
        }
        #shareMenu .file-label, #shareMenu .screen-share-btn {
            padding: 14px 28px; font-size: 1.2rem; border-radius: 50px;
            background: #1b6577; color: white; border: 1px solid #7ed1e0;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .screen-video-container {
            background: #001116; border-radius: 28px; padding: 16px; margin-bottom: 16px;
            border: 2px solid #00c8ff; display: none; flex-wrap: wrap; align-items: center; gap: 16px;
        }
        .screen-video-container video { width: 100%; max-height: 260px; border-radius: 24px; border: 2px solid #3fa5b5; }
        .stop-share-btn { background: #c24343; padding: 12px 24px; border-radius: 50px; font-weight: bold; color: white; border: none; cursor: pointer; }
        .fullscreen-btn { background: #256579; padding: 12px 24px; border-radius: 50px; font-weight: 600; border: 1px solid #a0e3ff; cursor: pointer; color: white; }
        
        #remoteAudioContainer { position: fixed; bottom: 0; right: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .hidden { display: none !important; }
        
        @media (max-width: 600px) {
            .messages { height: 300px; }
            .voice-btn { padding: 8px 16px; font-size: 0.85rem; }
            .voice-status { font-size: 0.85rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header"><h1>💬 Share<span style="color:#b3ecff;">Chat</span> · 🎙️ Auto Voice Mic</h1></div>
        <div class="username-panel">
            <label>👤 Name</label>
            <input type="text" id="usernameInput" placeholder="Your nickname" value="Guest" autocomplete="off">
        </div>

        <div id="preChatSection">
            <div id="generatorView" class="section">
                <div style="margin-bottom: 16px; font-weight: 700; color: #c3ecff; font-size:1.2rem;">🚀 Create Protected Room</div>
                <div class="flex-row">
                    <input type="text" id="customSessionId" placeholder="room name (optional)">
                </div>
                <div class="flex-row" style="margin-top: 16px;">
                    <input type="password" id="hostPasswordInput" placeholder="Set room password" autocomplete="off">
                </div>
                <div class="flex-row" style="margin-top: 16px;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoVoiceToggle" checked> 🎙️ Auto-enable microphone (auto join voice)
                    </label>
                </div>
                <div class="flex-row" style="margin-top: 16px;">
                    <button id="generateBtn" class="btn">🔗 Generate link</button>
                </div>
                <div id="linkOutput" style="display: none;" class="link-box">
                    <span id="shareableLink"></span>
                    <button id="copyLinkBtn" style="background: transparent; border: none; font-size: 1.8rem; color:white;">📋</button>
                </div>
                <div style="margin-top: 24px;">
                    <button id="hostChatBtn" class="btn" style="background: #1c7c8c;">🎤 Host with password</button>
                </div>
            </div>
        </div>

        <div id="chatInterface" class="hidden">
            <div class="chat-top-bar">
                <div class="left-status">
                    <span class="my-name-small" id="topBarUsername">Guest</span>
                    <span class="dot" id="stateDot"></span>
                </div>
                <button id="infoToggleBtn" class="three-dot-btn">⋮</button>
            </div>

            <div id="voiceCallBar" class="voice-call-bar">
                <div class="voice-status">
                    <span>🎙️ VOICE CHAT</span>
                    <span class="status-badge" id="voiceStatusText">🔴 OFF</span>
                </div>
                <div class="voice-controls">
                    <button id="voiceToggleBtn" class="voice-btn">🎤 Disable Mic</button>
                    <button id="muteMicBtn" class="voice-btn voice-mute">🔇 Mute</button>
                </div>
            </div>

            <div id="screenVideoContainer" class="screen-video-container">
                <video id="remoteScreenVideo" autoplay playsinline></video>
                <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
                    <span style="color:white; font-weight:700;" id="screenShareLabel">🖥️ SCREEN SHARE</span>
                    <button id="stopScreenShareBtn" class="stop-share-btn" style="display:none;">⏹️ Stop sharing</button>
                    <button id="fullscreenBtn" class="fullscreen-btn" style="display:none;">⛶ Fullscreen</button>
                </div>
            </div>

            <div id="infoPanel" class="info-panel">
                <div class="info-row"><span class="info-label">🔗 Room link</span><span id="roomLinkDisplayInfo" style="word-break:break-all;"></span><button id="copyRoomLinkInfoBtn" class="room-link-copy">📋 Copy</button></div>
                <div class="info-row"><span class="info-label">🔐 Password</span><span id="roomPasswordInfo">Protected</span><button id="showPasswordBtn" class="room-link-copy" style="background:#2e7285;">👁️ Show</button></div>
                <div class="info-row"><span class="info-label">🎙️ Auto Voice</span><span id="autoVoiceStatusInfo">Enabled</span><button id="toggleAutoVoiceInfo" class="room-link-copy">Toggle</button></div>
                <div class="info-row"><span class="info-label">🧊 ICE profile</span><select id="iceProfileSelectInfo"></select><button id="retryManualBtnInfo">🔁 Retry</button></div>
                <div class="info-row"><span class="info-label">👥 Active</span><span id="peerCountDisplayInfo">👤 1</span></div>
                <div class="info-row"><span class="info-label">🆔 My Peer ID</span><span id="myPeerIdInfo">-</span></div>
                <div class="info-row"><span class="info-label">🎚️ Voice bitrate</span><select id="voiceBitrateSelect"><option value="32000">32 kbps</option><option value="64000" selected>64 kbps</option><option value="128000">128 kbps</option></select></div>
            </div>

            <div class="chat-container">
                <div class="messages" id="messageLog">
                    <div class="message system">🎤 Microphone auto-enabled! You can talk immediately. Mute if needed.</div>
                </div>
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
                    <input type="file" id="documentUpload" accept="*/*" style="display:none;">
                    <button id="menuBtn">⋮</button>
                    <div id="shareMenu">
                        <label for="documentUpload" class="file-label">📎 File</label>
                        <button id="screenShareBtn" class="screen-share-btn">🖥️ Screen</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="remoteAudioContainer"></div>
        <span id="currentSessionSpan" style="display:none;"></span>
    </div>

    <script>
        (function(){
            const SERVER_PROFILES = [
                { name: "Google STUN", config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } },
                { name: "OpenRelay TURN", config: { iceServers: [{ urls: 'turn:openrelayproject.org:3478', username: 'openrelayproject', credential: 'openrelayproject' }] } },
                { name: "Full Combo", config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelayproject.org:3478', username: 'openrelayproject', credential: 'openrelayproject' }] } }
            ];
            
            let sessionId = null, isHost = false, myPeerId = null, myUsername = 'Guest', peer = null;
            let roomPassword = null;
            let hostConnections = new Map();
            let clientConn = null;
            let isConnected = false;
            let autoVoiceEnabled = true; // Auto-enable microphone on join
            
            // Voice state - AUTO ACTIVATED on join
            let voiceActive = false;
            let localAudioStream = null;
            let voiceCalls = new Map();
            let voiceMuted = false;
            let remoteAudioElements = new Map();
            
            let receivedMsgIds = new Set();
            
            // DOM Elements
            const preChatSection = document.getElementById('preChatSection');
            const chatInterface = document.getElementById('chatInterface');
            const usernameInput = document.getElementById('usernameInput');
            const messageLog = document.getElementById('messageLog');
            const messageInput = document.getElementById('messageInput');
            const documentUpload = document.getElementById('documentUpload');
            const topBarUsername = document.getElementById('topBarUsername');
            const stateDot = document.getElementById('stateDot');
            const myPeerIdInfo = document.getElementById('myPeerIdInfo');
            const peerCountDisplayInfo = document.getElementById('peerCountDisplayInfo');
            const roomLinkDisplayInfo = document.getElementById('roomLinkDisplayInfo');
            const roomPasswordInfo = document.getElementById('roomPasswordInfo');
            const autoVoiceStatusInfo = document.getElementById('autoVoiceStatusInfo');
            const copyRoomLinkInfoBtn = document.getElementById('copyRoomLinkInfoBtn');
            const showPasswordBtn = document.getElementById('showPasswordBtn');
            const toggleAutoVoiceInfo = document.getElementById('toggleAutoVoiceInfo');
            const iceProfileSelectInfo = document.getElementById('iceProfileSelectInfo');
            const retryManualBtnInfo = document.getElementById('retryManualBtnInfo');
            const voiceBitrateSelect = document.getElementById('voiceBitrateSelect');
            const infoToggleBtn = document.getElementById('infoToggleBtn');
            const infoPanel = document.getElementById('infoPanel');
            const screenShareBtn = document.getElementById('screenShareBtn');
            const screenVideoContainer = document.getElementById('screenVideoContainer');
            const remoteScreenVideo = document.getElementById('remoteScreenVideo');
            const stopScreenShareBtn = document.getElementById('stopScreenShareBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const menuBtn = document.getElementById('menuBtn');
            const shareMenu = document.getElementById('shareMenu');
            const voiceToggleBtn = document.getElementById('voiceToggleBtn');
            const muteMicBtn = document.getElementById('muteMicBtn');
            const voiceStatusText = document.getElementById('voiceStatusText');
            const remoteAudioContainer = document.getElementById('remoteAudioContainer');
            const hostAutoVoiceToggle = document.getElementById('autoVoiceToggle');
            
            function generateUUID() { return Date.now() + '-' + Math.random().toString(36).substring(2, 10); }
            function getUrlParam(p) { return new URLSearchParams(window.location.search).get(p); }
            function buildSessionUrl(s) { const url = new URL(window.location.href); url.searchParams.set('session', s); return url.toString(); }
            
            function appendSystemMessage(text, isVoiceEvent = false) {
                const div = document.createElement('div');
                div.className = 'message system' + (isVoiceEvent ? ' voice-event' : '');
                div.innerText = '🔹 ' + text;
                messageLog.appendChild(div);
                messageLog.scrollTop = messageLog.scrollHeight;
            }
            
            function displayMessage(msg, isSelf) {
                const div = document.createElement('div');
                div.className = 'message' + (isSelf ? ' self' : '');
                const sender = isSelf ? 'You' : (msg.senderName || msg.senderId?.substring(0,6) || 'Peer');
                div.innerHTML = `<strong>${sender}:</strong> ${msg.content}`;
                messageLog.appendChild(div);
                messageLog.scrollTop = messageLog.scrollHeight;
            }
            
            function addMessageToStore(msg, isSelf) {
                if (!msg.id) msg.id = generateUUID();
                if (receivedMsgIds.has(msg.id)) return false;
                receivedMsgIds.add(msg.id);
                displayMessage(msg, isSelf);
                return true;
            }
            
            function updatePeerCountUI() {
                if (isHost) {
                    peerCountDisplayInfo.innerText = `👥 ${hostConnections.size + 1}`;
                } else {
                    peerCountDisplayInfo.innerText = `👤 ${isConnected ? 'Connected' : 'Disconnected'}`;
                }
            }
            
            function updateVoiceUI() {
                if (voiceActive && localAudioStream) {
                    voiceStatusText.innerHTML = '🟢 LIVE';
                    voiceStatusText.style.color = '#aaffaa';
                    voiceToggleBtn.innerHTML = '🔴 Disable Mic';
                    voiceToggleBtn.classList.add('end-call');
                    stateDot.classList.add('voice-active');
                    muteMicBtn.disabled = false;
                } else {
                    voiceStatusText.innerHTML = '🔴 OFF';
                    voiceStatusText.style.color = '#ffaaaa';
                    voiceToggleBtn.innerHTML = '🎤 Enable Mic';
                    voiceToggleBtn.classList.remove('end-call');
                    stateDot.classList.remove('voice-active');
                    muteMicBtn.disabled = true;
                    muteMicBtn.innerHTML = '🔇 Mute';
                }
            }
            
            function updateAutoVoiceUI() {
                if (autoVoiceStatusInfo) {
                    autoVoiceStatusInfo.innerText = autoVoiceEnabled ? '✅ Enabled' : '❌ Disabled';
                }
            }
            
            function enableChat(enabled) {
                messageInput.disabled = !enabled;
                documentUpload.disabled = !enabled;
                if (enabled && !isHost && clientConn?.open) {
                    clientConn.send({ type: 'setUsername', username: myUsername, peerId: myPeerId });
                }
            }
            
            function createRemoteAudioElement(peerId) {
                let audioEl = remoteAudioElements.get(peerId);
                if (!audioEl) {
                    audioEl = document.createElement('audio');
                    audioEl.autoplay = true;
                    audioEl.controls = false;
                    audioEl.style.display = 'none';
                    remoteAudioContainer.appendChild(audioEl);
                    remoteAudioElements.set(peerId, audioEl);
                }
                return audioEl;
            }
            
            function applyVoiceBitrate(call) {
                const bitrate = parseInt(voiceBitrateSelect.value, 10);
                setTimeout(() => {
                    try {
                        const pc = call._pc;
                        if (pc && pc.getSenders) {
                            const audioSender = pc.getSenders().find(s => s.track?.kind === 'audio');
                            if (audioSender) {
                                const params = audioSender.getParameters();
                                if (!params.encodings) params.encodings = [{}];
                                params.encodings[0].maxBitrate = bitrate;
                                audioSender.setParameters(params);
                            }
                        }
                    } catch(e) {}
                }, 500);
            }
            
            // AUTO-START VOICE - called when user joins room
            async function autoStartVoice() {
                if (!autoVoiceEnabled) {
                    appendSystemMessage("🎙️ Auto-voice disabled. Click 'Enable Mic' to start talking.", true);
                    return;
                }
                if (voiceActive) return;
                
                try {
                    appendSystemMessage("🎤 Auto-enabling microphone...", true);
                    localAudioStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    voiceActive = true;
                    updateVoiceUI();
                    appendSystemMessage("✅ Microphone active! You can now talk to everyone in the room.", true);
                    
                    if (isHost) {
                        // Call all existing clients
                        for (let [peerId] of hostConnections.entries()) {
                            if (peerId !== myPeerId) {
                                const call = peer.call(peerId, localAudioStream);
                                voiceCalls.set(peerId, { call, audioElement: null });
                                applyVoiceBitrate(call);
                                appendSystemMessage(`📞 Voice connected to ${peerId.substring(0,6)}`, true);
                            }
                        }
                        if (hostConnections.size > 0) {
                            appendSystemMessage(`🎙️ Voice active with ${hostConnections.size} participant(s)`, true);
                        } else {
                            appendSystemMessage("🎙️ Voice ready - waiting for participants to join", true);
                        }
                    } else if (clientConn && clientConn.open) {
                        // Call host
                        const call = peer.call(sessionId, localAudioStream);
                        voiceCalls.set('host', { call, audioElement: null });
                        applyVoiceBitrate(call);
                        appendSystemMessage("📞 Connected to host voice", true);
                        call.on('close', () => {
                            if (voiceActive) {
                                appendSystemMessage("📞 Host disconnected from voice", true);
                            }
                        });
                    }
                } catch (err) {
                    appendSystemMessage("❌ Microphone error: " + err.message + " - Check permissions", true);
                    voiceActive = false;
                    updateVoiceUI();
                }
            }
            
            // Disable/Enable voice manually
            async function toggleVoiceManually() {
                if (voiceActive && localAudioStream) {
                    // Disable voice - stop microphone and close all calls
                    if (localAudioStream) {
                        localAudioStream.getTracks().forEach(t => t.stop());
                        localAudioStream = null;
                    }
                    for (let data of voiceCalls.values()) {
                        if (data.call) data.call.close();
                    }
                    voiceCalls.clear();
                    voiceActive = false;
                    updateVoiceUI();
                    appendSystemMessage("🔴 Microphone disabled. Click 'Enable Mic' to speak again.", true);
                } else {
                    // Enable voice
                    await autoStartVoice();
                }
            }
            
            function toggleMute() {
                if (!voiceActive || !localAudioStream) return;
                const audioTrack = localAudioStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    voiceMuted = !audioTrack.enabled;
                    muteMicBtn.innerHTML = voiceMuted ? "🎤 Unmute" : "🔇 Mute";
                    appendSystemMessage(voiceMuted ? "Mic muted - others can't hear you" : "Mic unmuted", true);
                }
            }
            
            // AUTO-ACCEPT incoming voice calls
            function handleIncomingVoiceCall(call) {
                const remotePeerId = call.peer;
                
                const audioEl = createRemoteAudioElement(remotePeerId);
                
                if (localAudioStream && voiceActive) {
                    call.answer(localAudioStream);
                    appendSystemMessage(`✅ Auto-connected to ${remotePeerId.substring(0,6)} voice`, true);
                } else if (voiceActive) {
                    call.answer();
                } else if (autoVoiceEnabled) {
                    // If auto-voice is enabled but not active yet, start it first
                    call.answer();
                    appendSystemMessage(`📞 Incoming voice from ${remotePeerId.substring(0,6)} - auto-joining...`, true);
                    setTimeout(() => {
                        if (!voiceActive) {
                            autoStartVoice();
                        }
                    }, 300);
                } else {
                    call.answer();
                    appendSystemMessage(`📞 Voice call from ${remotePeerId.substring(0,6)} (auto-voice disabled)`, true);
                }
                
                call.on('stream', (remoteStream) => {
                    appendSystemMessage(`🎤 Voice connected: ${remotePeerId.substring(0,6)} is talking`, true);
                    audioEl.srcObject = remoteStream;
                    audioEl.play().catch(e => console.log('Audio play blocked'));
                    
                    if (!window.audioEnabled) {
                        appendSystemMessage("🔊 Tap anywhere to enable audio output", true);
                        const enableAudio = () => {
                            audioEl.play().catch(console.log);
                            document.body.removeEventListener('click', enableAudio);
                            window.audioEnabled = true;
                        };
                        document.body.addEventListener('click', enableAudio, { once: true });
                    }
                });
                
                voiceCalls.set(remotePeerId, { call, audioElement: audioEl });
                applyVoiceBitrate(call);
                
                call.on('close', () => {
                    voiceCalls.delete(remotePeerId);
                    if (audioEl) audioEl.srcObject = null;
                    appendSystemMessage(`📞 Voice disconnected from ${remotePeerId.substring(0,6)}`, true);
                });
            }
            
            // Password Modal for Clients
            function showPasswordModal(callback) {
                const modal = document.createElement('div');
                modal.className = 'password-modal';
                modal.innerHTML = `
                    <div class="password-modal-content">
                        <h3>🔐 Room is Protected</h3>
                        <p style="color:#bbe6f0; margin-bottom:20px;">Enter password to join "${sessionId}"</p>
                        <input type="password" id="modalPasswordInput" placeholder="Room password" autocomplete="off">
                        <div id="modalError" class="error-msg"></div>
                        <button id="modalSubmitBtn" class="btn">Join Room</button>
                    </div>
                `;
                document.body.appendChild(modal);
                
                const input = modal.querySelector('#modalPasswordInput');
                const submitBtn = modal.querySelector('#modalSubmitBtn');
                const errorDiv = modal.querySelector('#modalError');
                
                const submit = () => {
                    const pwd = input.value;
                    if (pwd) {
                        modal.remove();
                        callback(pwd);
                    } else {
                        errorDiv.textContent = 'Please enter the password';
                    }
                };
                
                submitBtn.addEventListener('click', submit);
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
                input.focus();
            }
            
            // Client Connection with Password Auth
            function startClientConnection(password) {
                if (isHost) return;
                const profileIdx = parseInt(iceProfileSelectInfo.value, 10) || 0;
                const profile = SERVER_PROFILES[profileIdx];
                
                if (peer) peer.destroy();
                
                peer = new Peer({ config: profile.config, debug: 1 });
                
                peer.on('open', (id) => {
                    myPeerId = id;
                    myPeerIdInfo.innerText = id;
                    topBarUsername.innerText = myUsername;
                    stateDot.className = 'dot';
                    
                    const conn = peer.connect(sessionId, { reliable: true });
                    clientConn = conn;
                    
                    conn.on('open', () => {
                        conn.send({ type: 'auth', password: password, username: myUsername, peerId: myPeerId });
                    });
                    
                    conn.on('data', handleClientData);
                    conn.on('close', () => {
                        isConnected = false;
                        stateDot.className = 'dot';
                        enableChat(false);
                        appendSystemMessage("⚠️ Disconnected from room");
                    });
                });
                
                peer.on('call', (call) => {
                    handleIncomingVoiceCall(call);
                });
                
                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                    if (err.type === 'peer-unavailable') {
                        appendSystemMessage("❌ Room not found or host offline");
                    }
                });
            }
            
            function handleClientData(data) {
                if (data.type === 'auth_result') {
                    if (data.success) {
                        isConnected = true;
                        stateDot.className = 'dot active';
                        enableChat(true);
                        appendSystemMessage(`✅ Authenticated! Connected to "${sessionId}" as ${myUsername}`);
                        updatePeerCountUI();
                        
                        // AUTO-START VOICE after successful connection
                        setTimeout(() => {
                            autoStartVoice();
                        }, 500);
                    } else {
                        appendSystemMessage(`❌ Authentication failed: ${data.message || 'Wrong password'}`);
                        if (clientConn) clientConn.close();
                        setTimeout(() => {
                            showPasswordModal((pwd) => startClientConnection(pwd));
                        }, 1000);
                    }
                } else if (data.type === 'broadcast') {
                    if (data.msg && addMessageToStore(data.msg, false)) {
                        if (clientConn?.open) clientConn.send({ type: 'ack', msgId: data.msg.id });
                    }
                } else if (data.type === 'screenShareStart') {
                    if (data.sharerId && peer) {
                        const call = peer.call(data.sharerId, undefined, { metadata: { type: 'screen' } });
                        screenCalls = screenCalls || [];
                        screenCalls.push(call);
                        call.answer();
                        call.on('stream', (stream) => {
                            screenVideoContainer.style.display = 'flex';
                            remoteScreenVideo.srcObject = stream;
                            fullscreenBtn.style.display = 'inline-flex';
                        });
                    }
                } else if (data.type === 'screenShareStop') {
                    if (localScreenStream) {
                        localScreenStream.getTracks().forEach(t => t.stop());
                        localScreenStream = null;
                    }
                    screenVideoContainer.style.display = 'none';
                    remoteScreenVideo.srcObject = null;
                    fullscreenBtn.style.display = 'none';
                }
            }
            
            // Host Session with Password
            function hostSession() {
                if (!sessionId) { alert('Generate a link first'); return; }
                const password = document.getElementById('hostPasswordInput').value.trim();
                if (!password) {
                    alert('Please set a password for the room');
                    return;
                }
                roomPassword = password;
                roomPasswordInfo.innerText = '🔒 Protected';
                
                // Get auto-voice setting from checkbox
                autoVoiceEnabled = hostAutoVoiceToggle ? hostAutoVoiceToggle.checked : true;
                updateAutoVoiceUI();
                
                isHost = true;
                myUsername = usernameInput.value.trim() || 'Host';
                preChatSection.classList.add('hidden');
                chatInterface.classList.remove('hidden');
                topBarUsername.innerText = myUsername;
                roomLinkDisplayInfo.innerText = buildSessionUrl(sessionId);
                
                const profileIdx = parseInt(iceProfileSelectInfo.value, 10) || 0;
                const profile = SERVER_PROFILES[profileIdx];
                
                peer = new Peer(sessionId, { config: profile.config, debug: 1 });
                
                peer.on('open', (id) => {
                    myPeerId = id;
                    myPeerIdInfo.innerText = id;
                    stateDot.className = 'dot active';
                    enableChat(true);
                    appendSystemMessage(`🎤 Room hosted with password protection`, true);
                    updatePeerCountUI();
                    
                    // AUTO-START VOICE for host
                    setTimeout(() => {
                        autoStartVoice();
                    }, 500);
                });
                
                peer.on('connection', (conn) => {
                    const remotePeerId = conn.peer;
                    
                    const authHandler = (data) => {
                        if (data.type === 'auth') {
                            if (data.password === roomPassword) {
                                conn.send({ type: 'auth_result', success: true });
                                conn.off('data', authHandler);
                                
                                hostConnections.set(remotePeerId, conn);
                                updatePeerCountUI();
                                appendSystemMessage(`👤 ${data.username || remotePeerId.substring(0,6)} joined (authenticated)`);
                                
                                // If host has voice active, auto-connect voice to new participant
                                if (voiceActive && localAudioStream) {
                                    setTimeout(() => {
                                        const call = peer.call(remotePeerId, localAudioStream);
                                        voiceCalls.set(remotePeerId, { call, audioElement: null });
                                        applyVoiceBitrate(call);
                                        appendSystemMessage(`🎙️ Auto-connected voice to ${remotePeerId.substring(0,6)}`, true);
                                    }, 500);
                                }
                                
                                conn.on('data', (data) => handleHostData(remotePeerId, data, data.username));
                                conn.on('close', () => {
                                    hostConnections.delete(remotePeerId);
                                    voiceCalls.delete(remotePeerId);
                                    updatePeerCountUI();
                                    appendSystemMessage(`👋 ${remotePeerId.substring(0,6)} left`);
                                });
                            } else {
                                conn.send({ type: 'auth_result', success: false, message: 'Invalid password' });
                                setTimeout(() => conn.close(), 500);
                                appendSystemMessage(`❌ Auth failed for ${remotePeerId.substring(0,6)} - wrong password`);
                            }
                        }
                    };
                    
                    conn.on('data', authHandler);
                    
                    setTimeout(() => {
                        if (!hostConnections.has(remotePeerId)) {
                            conn.off('data', authHandler);
                            if (conn.open) conn.close();
                        }
                    }, 10000);
                });
                
                peer.on('call', (call) => {
                    handleIncomingVoiceCall(call);
                });
                
                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        alert('❌ Room name already taken. Use a different name.');
                    }
                });
            }
            
            function handleHostData(peerId, data, username) {
                if (data.type === 'chat') {
                    const msg = {
                        id: data.msgId || generateUUID(),
                        senderId: peerId,
                        senderName: username || data.senderName || peerId.substring(0,6),
                        type: 'chat',
                        content: data.content
                    };
                    addMessageToStore(msg, false);
                    for (let [pid, c] of hostConnections.entries()) {
                        if (pid !== peerId && c.open) {
                            c.send({ type: 'broadcast', msg: msg });
                        }
                    }
                } else if (data.type === 'screenShareStart') {
                    for (let [pid, c] of hostConnections.entries()) {
                        if (pid !== peerId && c.open) {
                            c.send({ type: 'screenShareStart', sharerId: peerId });
                        }
                    }
                } else if (data.type === 'screenShareStop') {
                    for (let [pid, c] of hostConnections.entries()) {
                        if (pid !== peerId && c.open) {
                            c.send({ type: 'screenShareStop' });
                        }
                    }
                }
            }
            
            let localScreenStream = null;
            let screenCalls = [];
            
            async function startScreenShare() {
                if (!peer) return;
                try {
                    if (localScreenStream) stopScreenShare();
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    localScreenStream = stream;
                    stopScreenShareBtn.style.display = 'inline-block';
                    screenVideoContainer.style.display = 'flex';
                    remoteScreenVideo.srcObject = stream;
                    fullscreenBtn.style.display = 'inline-flex';
                    
                    if (isHost) {
                        for (let [peerId] of hostConnections.entries()) {
                            const call = peer.call(peerId, stream);
                            screenCalls.push(call);
                        }
                    } else if (clientConn?.open) {
                        clientConn.send({ type: 'screenShareStart', sharerId: myPeerId });
                    }
                    stream.getVideoTracks()[0].onended = () => stopScreenShare();
                } catch (err) {
                    appendSystemMessage("❌ Screen share failed: " + err.message);
                }
            }
            
            function stopScreenShare() {
                if (localScreenStream) {
                    localScreenStream.getTracks().forEach(t => t.stop());
                    localScreenStream = null;
                }
                screenCalls.forEach(call => call.close());
                screenCalls = [];
                stopScreenShareBtn.style.display = 'none';
                fullscreenBtn.style.display = 'none';
                screenVideoContainer.style.display = 'none';
                remoteScreenVideo.srcObject = null;
                if (!isHost && clientConn?.open) {
                    clientConn.send({ type: 'screenShareStop' });
                }
            }
            
            function sendChatMessage(text) {
                if (!text.trim()) return;
                const senderName = usernameInput.value.trim() || 'Anonymous';
                const msgId = generateUUID();
                const msg = { id: msgId, senderId: myPeerId, senderName, type: 'chat', content: text };
                
                if (isHost) {
                    addMessageToStore(msg, true);
                    for (let [pid, conn] of hostConnections.entries()) {
                        if (conn.open) conn.send({ type: 'broadcast', msg: msg });
                    }
                } else if (clientConn?.open) {
                    addMessageToStore(msg, true);
                    clientConn.send({ type: 'chat', content: text, senderName, msgId });
                }
            }
            
            // Event Listeners
            document.getElementById('generateBtn').addEventListener('click', () => {
                let custom = document.getElementById('customSessionId').value.trim();
                let finalId = custom ? custom.replace(/\s+/g, '-').toLowerCase() : ('room-' + Date.now().toString(36));
                sessionId = finalId;
                const link = buildSessionUrl(finalId);
                document.getElementById('shareableLink').innerText = link;
                document.getElementById('linkOutput').style.display = 'flex';
                roomLinkDisplayInfo.innerText = link;
            });
            
            document.getElementById('copyLinkBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('shareableLink').innerText);
                appendSystemMessage("Link copied!");
            });
            
            document.getElementById('hostChatBtn').addEventListener('click', hostSession);
            
            copyRoomLinkInfoBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(roomLinkDisplayInfo.innerText);
                appendSystemMessage("Room link copied!");
            });
            
            showPasswordBtn?.addEventListener('click', () => {
                if (roomPassword) {
                    alert(`Room password: ${roomPassword}`);
                } else {
                    alert('No password set for this room');
                }
            });
            
            toggleAutoVoiceInfo?.addEventListener('click', () => {
                autoVoiceEnabled = !autoVoiceEnabled;
                updateAutoVoiceUI();
                appendSystemMessage(autoVoiceEnabled ? "Auto-voice enabled" : "Auto-voice disabled", true);
                if (autoVoiceEnabled && !voiceActive) {
                    autoStartVoice();
                }
            });
            
            screenShareBtn.addEventListener('click', () => { startScreenShare(); shareMenu.style.display = 'none'; });
            stopScreenShareBtn.addEventListener('click', () => stopScreenShare());
            fullscreenBtn.addEventListener('click', () => remoteScreenVideo.requestFullscreen?.());
            
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !messageInput.disabled && messageInput.value.trim()) {
                    sendChatMessage(messageInput.value);
                    messageInput.value = '';
                }
            });
            
            retryManualBtnInfo.addEventListener('click', () => {
                if (isHost) {
                    if (peer) peer.destroy();
                    hostConnections.clear();
                    hostSession();
                } else {
                    showPasswordModal((pwd) => startClientConnection(pwd));
                }
            });
            
            voiceToggleBtn.addEventListener('click', toggleVoiceManually);
            muteMicBtn.addEventListener('click', toggleMute);
            
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                shareMenu.style.display = shareMenu.style.display === 'flex' ? 'none' : 'flex';
            });
            
            document.addEventListener('click', (e) => {
                if (!menuBtn.contains(e.target) && !shareMenu.contains(e.target)) shareMenu.style.display = 'none';
            });
            
            infoToggleBtn.addEventListener('click', () => {
                infoPanel.style.display = infoPanel.style.display === 'flex' ? 'none' : 'flex';
            });
            
            SERVER_PROFILES.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = p.name;
                iceProfileSelectInfo.appendChild(opt);
            });
            iceProfileSelectInfo.value = 0;
            
            // Initialize from URL
            const urlSession = getUrlParam('session');
            if (urlSession) {
                sessionId = urlSession;
                preChatSection.classList.add('hidden');
                chatInterface.classList.remove('hidden');
                roomLinkDisplayInfo.innerText = buildSessionUrl(sessionId);
                myUsername = usernameInput.value.trim() || ('Guest_' + Math.random().toString(36).substring(2, 6));
                usernameInput.value = myUsername;
                topBarUsername.innerText = myUsername;
                showPasswordModal((pwd) => startClientConnection(pwd));
            } else {
                preChatSection.classList.remove('hidden');
                chatInterface.classList.add('hidden');
            }
            
            setInterval(() => updatePeerCountUI(), 1000);
            updateVoiceUI();
            updateAutoVoiceUI();
        })();
    </script>
</body>
</html>
