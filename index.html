<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>🎙️ GroupChat · Voice + Screen + File · Quality Control</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* ---------- 🎨 WhatsApp/Telegram inspired, clean & finger-friendly ---------- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0b1c26; background: radial-gradient(circle at 20% 30%, #1e3a4e, #0e1e26);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 8px;
        }
        .app {
            max-width: 1100px; width: 100%; background: #0e1e26; backdrop-filter: blur(30px);
            border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); padding: 20px 16px;
            border: 1px solid rgba(80,140,180,0.3);
        }
        .header { margin-bottom: 16px; }
        h1 { font-size: 1.9rem; font-weight: 700; color: #e6f7ff; display: flex; align-items: center; gap: 6px; }

        .username-panel {
            background: #142e3a; border-radius: 60px; padding: 12px 20px; margin-bottom: 20px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid #2e6b7c;
        }
        .username-panel label { font-weight: 700; color: #cae9ff; font-size: 1.1rem; }
        #usernameInput {
            flex: 1; min-width: 200px; padding: 14px 22px; border: none; border-radius: 50px;
            font-size: 1.1rem; background: #1d3e4c; color: white; outline: none;
            border: 1.5px solid transparent;
        }
        #usernameInput:focus { border-color: #4ab0d0; background: #15323d; }

        .section { background: #112e38cc; backdrop-filter: blur(8px); border-radius: 36px; padding: 24px 20px; margin-bottom: 20px; border: 1px solid #3c798b; }
        .flex-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
        .btn {
            background: #256579; border: none; color: white; padding: 14px 28px; border-radius: 60px;
            font-weight: 700; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 10px;
            cursor: pointer; border: 1px solid #80d0e0; box-shadow: 0 8px 16px #00000040;
        }
        .btn:hover { background: #34879c; transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }

        .link-box { background: #0d303b; padding: 16px 22px; border-radius: 60px; word-break: break-all; font-size: 1rem; border: 1px solid #4f9db2; display: flex; align-items: center; justify-content: space-between; margin-top: 16px; color: #dbf2ff; }
        #customSessionId { flex:1; padding: 16px 24px; border-radius: 60px; border: none; background: #1b4957; color: white; font-size: 1.1rem; border: 1px solid #30809b; }

        .chat-top-bar {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
            background: #0f2e38; border-radius: 60px; padding: 8px 20px; border: 1px solid #358197;
        }
        .left-status {
            display: flex; align-items: center; gap: 12px; background: #10333e; padding: 6px 18px;
            border-radius: 40px; border: 1px solid #3e98ab; color: #d2f0fc; font-size: 0.95rem;
        }
        .my-name-small { font-size: 0.95rem; font-weight: 600; color: #c2ecff; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #708e96; display: inline-block; }
        .dot.active { background: #3ae03a; box-shadow: 0 0 18px #26e626; }
        .three-dot-btn {
            background: #1f5768; border: none; color: white; font-size: 1.8rem; line-height: 1;
            padding: 0 12px; border-radius: 40px; cursor: pointer; border: 1px solid #6ab5c9;
            display: flex; align-items: center; justify-content: center; height: 48px;
        }

        .info-panel {
            background: #0f2f39; border-radius: 28px; padding: 22px; margin-bottom: 20px;
            border: 1px solid #3b98ad; display: none; flex-direction: column; gap: 16px;
            backdrop-filter: blur(8px);
        }
        .info-row {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            background: #10333e; padding: 12px 18px; border-radius: 60px; color: #e2f3ff;
        }
        .info-label { font-weight: 600; color: #aae1f0; margin-right: 12px; }
        .room-link-copy { background: #1b5768; padding: 8px 22px; border-radius: 40px; color: white; border: none; font-weight: 600; cursor: pointer; }
        #iceProfileSelectInfo, #qualitySelectInfo, #voiceQualitySelect {
            background: #1f5768; color: white; border: none; padding: 12px 24px; border-radius: 50px;
            font-size: 0.95rem; border: 1px solid #6ac8e0; flex: 1; min-width: 160px;
        }
        #retryManualBtnInfo { background: #2e7285; border: none; color: white; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; margin-left: 8px; }

        .chat-container {
            background: #0a232b; border-radius: 36px; padding: 20px; margin-top: 8px;
            border: 1px solid #2d7488;
        }
        .messages {
            background: #0b1c22; border-radius: 28px; padding: 22px 16px; 
            height: 540px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px;
            border: 1px solid #275f6b; box-shadow: inset 0 6px 12px #00000030;
        }
        .message {
            background: #1e424b; padding: 14px 20px; border-radius: 24px 24px 24px 8px;
            max-width: 85%; word-break: break-word; align-self: flex-start;
            border: 1px solid #4895a8; color: #f0fafc; font-size: 1.05rem; line-height: 1.45;
            box-shadow: 0 2px 6px #00000030;
        }
        .message.self {
            background: #1f5d6b; color: white; align-self: flex-end; border-radius: 24px 24px 8px 24px;
            border: 1px solid #83d1e0;
        }
        .message.system {
            background: transparent; color: #b7e1ed; align-self: center; font-size: 0.95rem;
            border: 1px dashed #519faf; max-width: 98%;
        }
        .file-attachment {
            background: #0f313a; border-radius: 18px; padding: 12px 16px; margin-top: 8px;
            display: flex; align-items: center; gap: 14px; border: 1px solid #5ba9b9;
        }
        .download-link { background: #1d6b7c; padding: 8px 18px; border-radius: 40px; color: white; text-decoration: none; font-weight: 600; }
        .message img { max-width: 200px; max-height: 200px; border-radius: 20px; border: 2px solid #519faf; }

        .input-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: #0b2c35;
            padding: 8px 12px; border-radius: 60px; border: 1px solid #328296; position: relative;
        }
        #messageInput {
            flex: 1 1 180px; min-width: 160px; padding: 12px 18px;
            border: none; border-radius: 50px; font-size: 1rem;
            background: #163f49; color: white; outline: none; border: 1.5px solid transparent;
        }
        #messageInput:focus { border-color: #71d0e3; background: #10333b; }
        #menuBtn {
            background: #1b5768; border: none; color: white; font-size: 1.8rem; line-height: 1;
            padding: 0 12px; border-radius: 40px; cursor: pointer; border: 1px solid #86d6e6;
            display: flex; align-items: center; justify-content: center; height: 48px; min-width: 48px;
        }
        #shareMenu {
            display: none; position: absolute; bottom: 70px; right: 10px; background: #0e2f38;
            border-radius: 28px; padding: 14px; border: 1.5px solid #4ba6b9; z-index: 200;
            flex-direction: column; gap: 12px; backdrop-filter: blur(12px);
        }
        #shareMenu button, #shareMenu label {
            padding: 12px 24px; font-size: 1.1rem; border-radius: 50px;
            background: #1b6577; color: white; border: 1px solid #7ed1e0;
            display: flex; align-items: center; gap: 10px; cursor: pointer; white-space: nowrap;
        }
        .voice-active-badge {
            background: #4caf50; border-radius: 30px; padding: 4px 12px; font-size: 0.75rem; margin-left: 12px;
            color: white; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;
        }
        .screen-video-container {
            background: #001116; border-radius: 28px; padding: 16px; margin-bottom: 16px;
            border: 2px solid #00c8ff; display: none; flex-wrap: wrap; align-items: center; gap: 16px;
        }
        .screen-video-container video { width: 100%; max-height: 240px; border-radius: 24px; border: 2px solid #3fa5b5; }
        .stop-share-btn { background: #c24343; padding: 12px 24px; border-radius: 50px; font-weight: bold; color: white; }
        .fullscreen-btn { background: #256579; padding: 12px 24px; border-radius: 50px; font-weight: 600; border: 1px solid #a0e3ff; cursor: pointer; color: white; }
        .voice-call-control {
            background: #0f2f39; border-radius: 60px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 12px; margin-left: 12px;
        }
        .voice-toggle-btn { background: #3a5e6b; border: none; padding: 6px 16px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; }
        .voice-toggle-btn.active { background: #d32f2f; box-shadow: 0 0 8px #ff5e5e; }
        .hidden { display: none !important; }
        @media (max-width: 600px) {
            .messages { height: 440px; }
            #shareMenu button, #shareMenu label { padding: 10px 18px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header"><h1>🎙️ Voice<span style="color:#b3ecff;">Chat+</span></h1></div>
    <div class="username-panel">
        <label>👤 Name</label>
        <input type="text" id="usernameInput" placeholder="Your nickname" value="Guest" autocomplete="off">
    </div>
    <div id="preChatSection">
        <div id="generatorView" class="section">
            <div style="margin-bottom: 16px; font-weight: 700; color: #c3ecff; font-size:1.2rem;">🚀 New room</div>
            <div class="flex-row">
                <input type="text" id="customSessionId" placeholder="room name (optional)">
                <button id="generateBtn" class="btn">🔗 Generate link</button>
            </div>
            <div id="linkOutput" style="display: none;" class="link-box">
                <span id="shareableLink"></span>
                <button id="copyLinkBtn" style="background: transparent; border: none; font-size: 1.8rem; color:white;">📋</button>
            </div>
            <div style="margin-top: 24px;"><button id="hostChatBtn" class="btn" style="background: #1c7c8c;">🎤 Host this room</button></div>
        </div>
    </div>

    <div id="chatInterface" class="hidden">
        <div class="chat-top-bar">
            <div class="left-status">
                <span class="my-name-small" id="topBarUsername">Guest</span>
                <span class="dot" id="stateDot"></span>
                <div id="voiceStatusBadge" style="display: none;" class="voice-active-badge">🎙️ Voice ON</div>
            </div>
            <button id="infoToggleBtn" class="three-dot-btn">⋮</button>
        </div>

        <div id="screenVideoContainer" class="screen-video-container">
            <video id="remoteScreenVideo" autoplay playsinline muted="false"></video>
            <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
                <span style="color:white; font-weight:700;" id="screenShareLabel">🖥️ SCREEN SHARE</span>
                <button id="stopScreenShareBtn" class="stop-share-btn" style="display:none;">⏹️ Stop sharing</button>
                <button id="fullscreenBtn" class="fullscreen-btn" style="display:none;">⛶ Fullscreen</button>
                <span id="audioHint" class="audio-hint" style="display:none;">🔊 Tap video for audio</span>
            </div>
        </div>

        <div id="infoPanel" class="info-panel">
            <div class="info-row"><span class="info-label">🔗 Room link</span><span id="roomLinkDisplayInfo" style="word-break: break-all;"></span><button id="copyRoomLinkInfoBtn" class="room-link-copy">📋 Copy</button></div>
            <div class="info-row"><span class="info-label">🧊 ICE profile</span><select id="iceProfileSelectInfo"></select><button id="retryManualBtnInfo">🔁 Retry</button></div>
            <div class="info-row"><span class="info-label">📡 Current ICE</span><span id="currentIceProfileInfo">⚙️ -</span></div>
            <div class="info-row"><span class="info-label">👥 Active clients</span><span id="peerCountDisplayInfo">👤 1</span></div>
            <div class="info-row"><span class="info-label">🆔 My Peer ID</span><span id="myPeerIdInfo">-</span></div>
            <div class="info-row"><span class="info-label">📶 ICE state</span><span id="iceStateInfo">new</span></div>
            <div class="info-row"><span class="info-label">🎮 Video quality</span><select id="qualitySelectInfo"><option value="low">Low (480p,10fps)</option><option value="medium" selected>Medium (720p,15fps)</option><option value="high">High (1080p,30fps)</option></select></div>
            <div class="info-row"><span class="info-label">🎤 Voice quality</span><select id="voiceQualitySelect"><option value="low">Low (8kHz, mono)</option><option value="medium" selected>Medium (16kHz, mono)</option><option value="high">High (48kHz, stereo)</option></select></div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messageLog">
                <div class="message system">🎙️ Voice support added! Click "🎤 Voice" to talk (PTT mode).</div>
            </div>
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
                <input type="file" id="documentUpload" accept="*/*" style="display:none;">
                <button id="menuBtn">⋮</button>
                <div id="shareMenu">
                    <label for="documentUpload" class="file-label">📎 File</label>
                    <button id="screenShareBtn" class="screen-share-btn">🖥️ Screen</button>
                    <button id="voiceChatBtn" class="voice-chat-btn">🎤 Voice (PTT)</button>
                </div>
            </div>
        </div>
    </div>
    <span id="currentSessionSpan" style="display:none;"></span>
</div>

<script>
    (function(){
        "use strict";
        // ========== ICE PROFILES (unchanged) ==========
        const SERVER_PROFILES = [
            { name: "1. Google STUN only", config: { iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ] } },
            { name: "2. OpenRelay TURN (UDP)", config: { iceServers: [ { urls: 'turn:openrelayproject.org:3478', username: 'openrelayproject', credential: 'openrelayproject' } ] } },
            { name: "3. OpenRelay TURN (TCP)", config: { iceServers: [ { urls: 'turn:openrelayproject.org:3478?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' } ] } },
            { name: "4. AnyFirewall TURN (TCP/443)", config: { iceServers: [ { urls: 'turn:turn.anyfirewall.com:443?transport=tcp', username: 'webrtc', credential: 'webrtc' } ] } },
            { name: "5. Full combo", config: { iceServers: [ { urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelayproject.org:3478', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:turn.anyfirewall.com:443?transport=tcp', username: 'webrtc', credential: 'webrtc' } ] } }
        ];
        const VOICE_QUALITY = { low: { sampleRate: 8000, channelCount: 1 }, medium: { sampleRate: 16000, channelCount: 1 }, high: { sampleRate: 48000, channelCount: 2 } };
        
        let sessionId = null, isHost = false, myPeerId = null, myUsername = 'Guest';
        let peer = null;
        let hostConnections = new Map();
        let clientConn = null;
        // Voice streams & calls
        let localVoiceStream = null;
        let activeVoiceCalls = new Map(); // peerId -> MediaConnection
        let voicePushToTalkActive = false;
        let voiceQuality = "medium";
        
        let activeScreenSharperId = null, localScreenShareStream = null, isViewingScreen = false, screenShareCalls = [];
        let isConnecting = false, currentProfileIndex = 0, manualRetry = false;
        let connectionAttemptTimeout = null, iceNewTimeout = null;
        let messageStore = [], receivedMsgIds = new Set(), hostMessageMap = new Map(), clientAcks = new Map();
        
        // UI elements
        const preChatSection = document.getElementById('preChatSection');
        const chatInterface = document.getElementById('chatInterface');
        const usernameInput = document.getElementById('usernameInput');
        const messageLog = document.getElementById('messageLog');
        const messageInput = document.getElementById('messageInput');
        const documentUpload = document.getElementById('documentUpload');
        const topBarUsername = document.getElementById('topBarUsername');
        const iceProfileSelectInfo = document.getElementById('iceProfileSelectInfo');
        const retryManualBtnInfo = document.getElementById('retryManualBtnInfo');
        const qualitySelectInfo = document.getElementById('qualitySelectInfo');
        const voiceQualitySelect = document.getElementById('voiceQualitySelect');
        const infoToggleBtn = document.getElementById('infoToggleBtn');
        const infoPanel = document.getElementById('infoPanel');
        const roomLinkDisplayInfo = document.getElementById('roomLinkDisplayInfo');
        const copyRoomLinkInfoBtn = document.getElementById('copyRoomLinkInfoBtn');
        const currentIceProfileInfo = document.getElementById('currentIceProfileInfo');
        const peerCountDisplayInfo = document.getElementById('peerCountDisplayInfo');
        const iceStateInfo = document.getElementById('iceStateInfo');
        const myPeerIdInfo = document.getElementById('myPeerIdInfo');
        const stateDot = document.getElementById('stateDot');
        const voiceStatusBadge = document.getElementById('voiceStatusBadge');
        const screenShareBtn = document.getElementById('screenShareBtn');
        const screenVideoContainer = document.getElementById('screenVideoContainer');
        const remoteScreenVideo = document.getElementById('remoteScreenVideo');
        const stopScreenShareBtn = document.getElementById('stopScreenShareBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const menuBtn = document.getElementById('menuBtn');
        const shareMenu = document.getElementById('shareMenu');
        const voiceChatBtn = document.getElementById('voiceChatBtn');
        
        function populateIceSelect() { SERVER_PROFILES.forEach((p,i)=>{ let o=document.createElement('option'); o.value=i; o.textContent=p.name; iceProfileSelectInfo.appendChild(o); }); iceProfileSelectInfo.value=SERVER_PROFILES.length-1; }
        populateIceSelect();
        function generateUUID() { return Date.now() + '-' + Math.random().toString(36).substring(2,10); }
        function getUrlParam(p) { return new URLSearchParams(window.location.search).get(p); }
        function buildSessionUrl(s) { const url = new URL(window.location.href); url.searchParams.set('session', s); return url.toString(); }
        function appendSystemMessage(text) { let d=document.createElement('div'); d.className='message system'; d.innerText='🔹 '+text; messageLog.appendChild(d); messageLog.scrollTop=messageLog.scrollHeight; }
        
        // ========== VOICE CORE ==========
        async function initVoiceStream() {
            if (localVoiceStream) return localVoiceStream;
            try {
                const constraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                localVoiceStream = stream;
                applyVoiceQualityToStream(localVoiceStream);
                return stream;
            } catch(e) { appendSystemMessage("❌ Microphone access denied: "+e.message); return null; }
        }
        function applyVoiceQualityToStream(stream) {
            const q = VOICE_QUALITY[voiceQuality] || VOICE_QUALITY.medium;
            const audioTrack = stream.getAudioTracks()[0];
            if (audioTrack && audioTrack.applyConstraints) {
                audioTrack.applyConstraints({ sampleRate: q.sampleRate, channelCount: q.channelCount }).catch(e=>console.warn);
            }
        }
        function startVoiceCallToPeer(targetPeerId) {
            if (!localVoiceStream) { appendSystemMessage("🎤 Requesting mic..."); initVoiceStream().then(stream=>{ if(stream) startVoiceCallToPeer(targetPeerId); }); return; }
            if (activeVoiceCalls.has(targetPeerId)) return;
            const call = peer.call(targetPeerId, localVoiceStream);
            activeVoiceCalls.set(targetPeerId, call);
            call.on('stream', (remoteStream) => { /* auto-play handled by browser */ appendSystemMessage(`🎙️ Voice connected with ${targetPeerId.slice(0,6)}`); });
            call.on('close', () => { activeVoiceCalls.delete(targetPeerId); appendSystemMessage(`🔇 Voice ended with ${targetPeerId.slice(0,6)}`); });
        }
        function handleIncomingVoiceCall(call) {
            if (!localVoiceStream) { initVoiceStream().then(stream=>{ if(stream) call.answer(stream); }); } 
            else { call.answer(localVoiceStream); }
            activeVoiceCalls.set(call.peer, call);
            call.on('stream', (remoteStream) => { appendSystemMessage(`🎙️ Incoming voice from ${call.peer.slice(0,6)}`); });
            call.on('close', () => { activeVoiceCalls.delete(call.peer); });
        }
        function broadcastVoiceToAll() {
            if (!isHost && clientConn?.open) { clientConn.send({ type: 'voiceToggle', active: voicePushToTalkActive }); return; }
            if (isHost) {
                hostConnections.forEach((conn, pid) => { if(conn.open) conn.send({ type: 'voiceToggle', active: voicePushToTalkActive }); });
                if (voicePushToTalkActive && localVoiceStream) {
                    hostConnections.forEach((_, pid) => { if(!activeVoiceCalls.has(pid)) startVoiceCallToPeer(pid); });
                } else if (!voicePushToTalkActive) {
                    activeVoiceCalls.forEach((call, pid) => { call.close(); activeVoiceCalls.delete(pid); });
                }
            }
        }
        async function toggleVoicePTT() {
            if (!peer) { appendSystemMessage("⚠️ Not connected yet."); return; }
            if (!voicePushToTalkActive) {
                const stream = await initVoiceStream();
                if (!stream) return;
                voicePushToTalkActive = true;
                voiceStatusBadge.style.display = "inline-flex";
                voiceChatBtn.classList.add("active");
                voiceChatBtn.style.background = "#d32f2f";
                voiceChatBtn.innerHTML = "🔴 Voice (ON)";
                if (isHost) {
                    hostConnections.forEach((_, pid) => { startVoiceCallToPeer(pid); });
                } else if (clientConn?.open) {
                    clientConn.send({ type: 'voiceToggle', active: true });
                }
                appendSystemMessage("🎤 Voice ON (push-to-talk style)");
            } else {
                voicePushToTalkActive = false;
                voiceStatusBadge.style.display = "none";
                voiceChatBtn.classList.remove("active");
                voiceChatBtn.style.background = "#1b6577";
                voiceChatBtn.innerHTML = "🎤 Voice (PTT)";
                activeVoiceCalls.forEach((call, pid) => { call.close(); activeVoiceCalls.delete(pid); });
                if (!isHost && clientConn?.open) clientConn.send({ type: 'voiceToggle', active: false });
                appendSystemMessage("🔇 Voice OFF");
            }
        }
        
        // ========== HOST/CLIENT modifications for voice ==========
        function handleHostVoiceToggle(peerId, active) {
            if (active) {
                if (!activeVoiceCalls.has(peerId) && localVoiceStream) startVoiceCallToPeer(peerId);
            } else {
                let call = activeVoiceCalls.get(peerId);
                if (call) { call.close(); activeVoiceCalls.delete(peerId); }
            }
        }
        function handleClientVoiceToggle(active) {
            if (active) {
                if (isHost && localVoiceStream) hostConnections.forEach((_, pid)=>startVoiceCallToPeer(pid));
                else if (!isHost && clientConn?.open && localVoiceStream && peer) startVoiceCallToPeer(sessionId);
            } else {
                activeVoiceCalls.forEach((call)=>call.close());
                activeVoiceCalls.clear();
            }
        }
        // extend hostData handler
        const originalHandleHostData = null; // we will override
        function extendedHandleHostData(peerId, data) {
            if (data.type === 'voiceToggle') { handleHostVoiceToggle(peerId, data.active); return; }
            // fallback to original handlers inside main flow - we'll override in main
        }
        
        // ========== EXISTING logic with voice hooks ==========
        function displayMessage(msg, isSelf=false) { /* same as original but simplified */ 
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message' + (isSelf ? ' self' : '');
            let senderDisplay = msg.senderName ? msg.senderName : (msg.senderId === myPeerId ? 'You' : 'Peer');
            let contentHtml = '';
            if (msg.type === 'file' || msg.type === 'image') {
                if(msg.fileInfo?.type?.startsWith('image/')) contentHtml = `<strong>${senderDisplay}:</strong><br><img src="${msg.content}" style="max-width:200px;">`;
                else contentHtml = `<strong>${senderDisplay}:</strong> <div class="file-attachment"><span>📄</span><span>${msg.fileInfo?.name||'file'}</span><a href="${msg.content}" download class="download-link">⬇️</a></div>`;
            } else contentHtml = `<strong>${senderDisplay}:</strong> ${msg.content}`;
            msgDiv.innerHTML = contentHtml;
            messageLog.appendChild(msgDiv);
            messageLog.scrollTop = messageLog.scrollHeight;
        }
        function addMessageToStore(msg, isSelf=false) { if(!msg.id) msg.id=generateUUID(); if(receivedMsgIds.has(msg.id)) return false; receivedMsgIds.add(msg.id); messageStore.push(msg); displayMessage(msg, isSelf); return true; }
        
        // CLIENT data handler extended
        function handleClientData(data) {
            if (data.type === 'broadcast' && data.msg) { addMessageToStore(data.msg, data.msg.senderId===myPeerId); if(clientConn?.open) clientConn.send({type:'ack', msgId:data.msg.id}); }
            else if (data.type === 'history') { data.messages.forEach(msg=>{ if(!receivedMsgIds.has(msg.id)){ addMessageToStore(msg, msg.senderId===myPeerId); if(clientConn?.open) clientConn.send({type:'ack', msgId:msg.id}); } }); }
            else if (data.type === 'voiceToggle') { handleClientVoiceToggle(data.active); }
            else if (data.type === 'screenShareStop') { if(isViewingScreen){ screenVideoContainer.style.display='none'; remoteScreenVideo.srcObject=null; isViewingScreen=false; fullscreenBtn.style.display='none';} }
            else if (data.type === 'screenShareInitiate' && data.viewers && localScreenShareStream) { data.viewers.forEach(vid=>{ const call=peer.call(vid, localScreenShareStream); screenShareCalls.push(call); applyQualityToCall(call, qualitySelectInfo.value); }); }
            else if (data.type === 'applyQuality' && localScreenShareStream) applyQualityToLocalStream(data.quality);
        }
        
        // Quality helpers (unchanged)
        const QUALITY_PRESETS = { low: { video:{width:{ideal:854},height:{ideal:480},frameRate:{ideal:10}}, bitrate:300000 }, medium: { video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:15}}, bitrate:500000 }, high: { video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}, bitrate:1000000 } };
        async function applyQualityToSender(sender,q) { if(!sender) return; const preset=QUALITY_PRESETS[q]||QUALITY_PRESETS.medium; if(sender.track?.kind==='video') try{await sender.track.applyConstraints(preset.video);}catch(e){} try{const p=sender.getParameters(); if(!p.encodings)p.encodings=[{}]; p.encodings[0].maxBitrate=preset.bitrate; await sender.setParameters(p);}catch(e){} }
        function applyQualityToCall(call,q){ setTimeout(()=>{ try{const pc=call._pc; const vs=pc?.getSenders()?.find(s=>s.track?.kind==='video'); applyQualityToSender(vs,q);}catch(e){} },500); }
        async function applyQualityToLocalStream(q){ if(!localScreenShareStream) return; const preset=QUALITY_PRESETS[q]; const vt=localScreenShareStream.getVideoTracks()[0]; if(vt) try{await vt.applyConstraints(preset.video);}catch(e){} screenShareCalls.forEach(c=>applyQualityToCall(c,q)); }
        function requestQualityChange(q){ if(localScreenShareStream) applyQualityToLocalStream(q); else if(activeScreenSharperId && clientConn?.open) clientConn.send({type:'qualityRequest', sharerId:activeScreenSharperId, quality:q}); }
        
        // screen share handlers (simplified, reuse existing)
        async function startScreenShare(){ /* same core */ if(!peer)return; try{ if(localScreenShareStream) stopMyScreenShare(true); const preset=QUALITY_PRESETS.medium; const stream=await navigator.mediaDevices.getDisplayMedia({video:preset.video, audio:true}); localScreenShareStream=stream; stopScreenShareBtn.style.display='inline-block'; screenShareLabel.innerText='🖥️ Sharing (audio)'; screenVideoContainer.style.display='flex'; remoteScreenVideo.srcObject=stream; fullscreenBtn.style.display='inline-flex'; if(isHost) hostHandleNewScreenShare(myPeerId); else if(clientConn?.open) clientConn.send({type:'screenShareStart', sharerPeerId:myPeerId}); const origCall=peer.call; peer.call=function(pid,stream,opts){ const call=origCall.call(this,pid,stream,opts); applyQualityToCall(call, qualitySelectInfo.value); screenShareCalls.push(call); call.on('close',()=>screenShareCalls=screenShareCalls.filter(c=>c!==call)); return call; }; stream.getVideoTracks()[0].onended=()=>stopMyScreenShare(); }catch(err){ appendSystemMessage('❌ Screen share: '+err.message); } }
        function stopMyScreenShare(localOnly=false){ if(localScreenShareStream){ localScreenShareStream.getTracks().forEach(t=>t.stop()); localScreenShareStream=null; } screenShareCalls.forEach(c=>c.close()); screenShareCalls=[]; stopScreenShareBtn.style.display='none'; fullscreenBtn.style.display='none'; screenVideoContainer.style.display='none'; remoteScreenVideo.srcObject=null; isViewingScreen=false; if(!isHost && clientConn?.open) clientConn.send({type:'screenShareStop'}); else if(isHost) hostBroadcastScreenShareStop(); }
        function hostHandleNewScreenShare(sharerPeerId){ if(activeScreenSharperId && activeScreenSharperId!==sharerPeerId) hostBroadcastScreenShareStop(); activeScreenSharperId=sharerPeerId; const viewers=[]; hostConnections.forEach((_,pid)=>{ if(pid!==sharerPeerId) viewers.push(pid);}); if(sharerPeerId===myPeerId) hostAsSharerCallViewers(viewers); else{ const sharerConn=hostConnections.get(sharerPeerId); if(sharerConn?.open) sharerConn.send({type:'screenShareInitiate', viewers}); } const msg={type:'screenShareStart', sharerPeerId}; hostConnections.forEach((conn,pid)=>{ if(pid!==sharerPeerId && conn.open) conn.send(msg); }); }
        function hostAsSharerCallViewers(viewerIds){ if(!localScreenShareStream)return; viewerIds.forEach(vid=>{ try{ const call=peer.call(vid, localScreenShareStream); screenShareCalls.push(call); call.on('close',()=>screenShareCalls=screenShareCalls.filter(c=>c!==call)); }catch(e){} }); }
        function hostBroadcastScreenShareStop(){ const msg={type:'screenShareStop'}; hostConnections.forEach(conn=>{ if(conn.open) conn.send(msg); }); screenVideoContainer.style.display='none'; remoteScreenVideo.srcObject=null; isViewingScreen=false; if(activeScreenSharperId===myPeerId) stopMyScreenShare(true); activeScreenSharperId=null; fullscreenBtn.style.display='none'; }
        function handleIncomingScreenShareCall(call){ if(localScreenShareStream) call.answer(localScreenShareStream); else{ call.answer(); call.on('stream',(rs)=>{ screenVideoContainer.style.display='flex'; remoteScreenVideo.srcObject=rs; isViewingScreen=true; screenShareLabel.innerText=`🖥️ Screen`; fullscreenBtn.style.display='inline-flex'; }); } }
        
        // Host session override with voice support
        function hostSession() { if(!sessionId) { alert('Generate a link first'); return; } isHost=true; myUsername=usernameInput.value.trim()||'Host'; preChatSection.classList.add('hidden'); chatInterface.classList.remove('hidden'); currentSessionSpan.innerText=sessionId; roomLinkDisplayInfo.innerText=buildSessionUrl(sessionId); topBarUsername.innerText=myUsername; const profileIndex=parseInt(iceProfileSelectInfo.value,10)||0; const profile=SERVER_PROFILES[profileIndex]; currentIceProfileInfo.innerText=`🎤 host: ${profile.name}`; peer=new Peer(sessionId,{config:profile.config,debug:1}); peer.on('call', (call)=>{ if(call.metadata?.type==='voice') handleIncomingVoiceCall(call); else handleIncomingScreenShareCall(call); }); peer.on('open',(id)=>{ myPeerId=id; myPeerIdInfo.innerText=id; stateDot.className='dot active'; enableChat(true); screenShareBtn.style.display='inline-flex'; updatePeerCountUI(); }); peer.on('connection',(conn)=>{ const remotePeerId=conn.peer; hostConnections.set(remotePeerId,conn); updatePeerCountUI(); conn.on('data',(data)=>handleHostDataExtended(remotePeerId,data)); conn.on('close',()=>{ hostRemovePeer(remotePeerId); if(activeScreenSharperId===remotePeerId) hostBroadcastScreenShareStop(); }); hostSendFilteredHistory(conn,remotePeerId); }); peer.on('error',(err)=>{ if(err.type==='unavailable-id') alert('Room name taken.'); else appendSystemMessage('Host error: '+err.type); }); }
        function handleHostDataExtended(peerId,data){ if(data.type==='voiceToggle'){ handleHostVoiceToggle(peerId, data.active); return; } if(data.type==='chat') hostProcessNewMessage(peerId,data.senderName,'chat',data.content,null,data.msgId); else if(data.type==='file') hostProcessNewMessage(peerId,data.senderName,'file',data.content,data.fileInfo,data.msgId); else if(data.type==='ack') hostProcessAck(peerId,data.msgId); else if(data.type==='screenShareStart') hostHandleNewScreenShare(peerId); else if(data.type==='screenShareStop'){ if(activeScreenSharperId===peerId) hostBroadcastScreenShareStop(); } else if(data.type==='qualityRequest' && data.sharerId && data.quality){ const sc=hostConnections.get(data.sharerId); if(sc?.open) sc.send({type:'applyQuality', quality:data.quality}); } }
        function hostProcessNewMessage(senderPeerId,senderName,type,content,fileInfo,providedMsgId){ const msgId=providedMsgId||generateUUID(); const msg={id:msgId,senderId:senderPeerId,senderName:senderName||'unknown',type,content,timestamp:Date.now()}; if(fileInfo) msg.fileInfo=fileInfo; const ackSet=new Set([senderPeerId,myPeerId]); hostMessageMap.set(msgId,{msg,acks:ackSet}); if(!clientAcks.has(senderPeerId)) clientAcks.set(senderPeerId,new Set()); clientAcks.get(senderPeerId).add(msgId); if(!clientAcks.has(myPeerId)) clientAcks.set(myPeerId,new Set()); clientAcks.get(myPeerId).add(msgId); addMessageToStore(msg, senderPeerId===myPeerId); const broadcastMsg={type:'broadcast',msg:msg}; hostConnections.forEach((conn,pid)=>{ if(pid!==senderPeerId && conn.open) conn.send(broadcastMsg); }); }
        function hostProcessAck(peerId,msgId){ if(!hostMessageMap.has(msgId)) return; const entry=hostMessageMap.get(msgId); entry.acks.add(peerId); if(!clientAcks.has(peerId)) clientAcks.set(peerId,new Set()); clientAcks.get(peerId).add(msgId); const totalParticipants=hostConnections.size+1; if(entry.acks.size>=totalParticipants) { hostMessageMap.delete(msgId); clientAcks.forEach(set=>set.delete(msgId)); } }
        function hostRemovePeer(peerId){ hostConnections.delete(peerId); hostMessageMap.forEach(entry=>entry.acks.delete(peerId)); updatePeerCountUI(); const total=hostConnections.size+1; hostMessageMap.forEach((entry,mid)=>{ if(entry.acks.size>=total){ hostMessageMap.delete(mid); clientAcks.forEach(s=>s.delete(mid)); } }); }
        function hostSendFilteredHistory(conn,peerId){ const acks=clientAcks.get(peerId)||new Set(); const toSend=[]; hostMessageMap.forEach((val,mid)=>{ if(!acks.has(mid)) toSend.push(val.msg); }); if(toSend.length) conn.send({type:'history', messages:toSend}); }
        function updatePeerCountUI(){ if(isHost) peerCountDisplayInfo.innerText=`👥 ${hostConnections.size+1}`; else peerCountDisplayInfo.innerText='👤 1'; }
        function enableChat(enable){ messageInput.disabled=!enable; documentUpload.disabled=!enable; if(enable) messageInput.focus(); }
        
        // Client connection (simplified)
        function startClientConnection(){ if(isHost)return; currentProfileIndex=parseInt(iceProfileSelectInfo.value,10)||0; retryCount=0; attemptConnection(); }
        function attemptConnection(){ if(isHost)return; clearTimeouts(); if(currentProfileIndex>=SERVER_PROFILES.length) currentProfileIndex=0; const profile=SERVER_PROFILES[currentProfileIndex]; isConnecting=true; manualRetry=false; currentIceProfileInfo.innerText=`⏳ ${profile.name}`; if(peer)peer.destroy(); peer=new Peer({config:profile.config,debug:1}); peer.on('iceconnectionstatechange',()=>{ const s=peer.iceConnectionState||'new'; iceStateInfo.innerText=s; stateDot.className=(s==='connected'||s==='completed')?'dot active':'dot'; if((s==='failed'||s==='disconnected') && isConnecting && !manualRetry) moveToNextProfileAndRetry(); }); peer.on('call',(call)=>{ if(call.metadata?.type==='voice') handleIncomingVoiceCall(call); else handleIncomingScreenShareCall(call); }); peer.on('open',(id)=>{ if(!isConnecting)return; myPeerId=id; myPeerIdInfo.innerText=id; topBarUsername.innerText=myUsername; connectionAttemptTimeout=setTimeout(()=>{ if(isConnecting && !manualRetry) moveToNextProfileAndRetry(); },20000); const conn=peer.connect(sessionId,{reliable:true}); clientConn=conn; setupClientConnection(conn); }); peer.on('error',()=>{ if(isConnecting && !manualRetry) moveToNextProfileAndRetry(); }); }
        function setupClientConnection(conn){ conn.on('open',()=>{ clearTimeouts(); if(!isConnecting)return; isConnecting=false; stateDot.className='dot active'; currentIceProfileInfo.innerText=`✅ ${SERVER_PROFILES[currentProfileIndex].name}`; enableChat(true); screenShareBtn.style.display='inline-flex'; conn.send({type:'setUsername', username:myUsername, peerId:myPeerId}); appendSystemMessage('✅ Joined as '+myUsername); }); conn.on('data',handleClientData); conn.on('close',()=>{ enableChat(false); screenShareBtn.style.display='none'; if(!manualRetry) startClientConnection(); }); }
        function moveToNextProfileAndRetry(){ if(isHost)return; clearTimeouts(); currentProfileIndex++; if(currentProfileIndex>=SERVER_PROFILES.length) currentProfileIndex=0; setTimeout(()=>{ if(!manualRetry && isConnecting) attemptConnection(); },3000); }
        function clearTimeouts(){ if(connectionAttemptTimeout)clearTimeout(connectionAttemptTimeout); if(iceNewTimeout)clearTimeout(iceNewTimeout); }
        
        // send helpers
        function sendChatMessage(text){ if(!text.trim())return; const msgId=generateUUID(); const senderName=usernameInput.value.trim()||'Anonymous'; if(isHost) hostProcessNewMessage(myPeerId,senderName,'chat',text,null,msgId); else if(clientConn?.open){ clientConn.send({type:'chat', content:text, senderName, msgId}); addMessageToStore({id:msgId,senderId:myPeerId,senderName,type:'chat',content:text},true); } }
        function sendFile(file,base64Data){ const senderName=usernameInput.value.trim()||'Anonymous'; const msgId=generateUUID(); const fileInfo={name:file.name, size:file.size, type:file.type}; if(isHost) hostProcessNewMessage(myPeerId,senderName,'file',base64Data,fileInfo,msgId); else if(clientConn?.open){ clientConn.send({type:'file', content:base64Data, senderName, fileInfo, msgId}); addMessageToStore({id:msgId,senderId:myPeerId,senderName,type:'file',content:base64Data,fileInfo},true); } }
        
        // Event listeners
        usernameInput.addEventListener('input',e=>{ myUsername=e.target.value.trim()||'Guest'; topBarUsername.innerText=myUsername; });
        document.getElementById('generateBtn').addEventListener('click',()=>{ let custom=document.getElementById('customSessionId').value.trim(); let finalId=custom?custom.replace(/\s+/g,'-').toLowerCase():('room-'+Date.now().toString(36)+'-'+Math.random().toString(36).substring(2,6)); sessionId=finalId; const link=buildSessionUrl(finalId); document.getElementById('shareableLink').innerText=link; document.getElementById('linkOutput').style.display='flex'; roomLinkDisplayInfo.innerText=link; });
        document.getElementById('copyLinkBtn').addEventListener('click',()=>navigator.clipboard.writeText(document.getElementById('shareableLink').innerText));
        document.getElementById('hostChatBtn').addEventListener('click',hostSession);
        copyRoomLinkInfoBtn.addEventListener('click',()=>navigator.clipboard.writeText(roomLinkDisplayInfo.innerText));
        documentUpload.addEventListener('change',function(e){ const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=(ev)=>{ sendFile(file, ev.target.result); documentUpload.value=''; shareMenu.style.display='none'; }; reader.readAsDataURL(file); });
        screenShareBtn.addEventListener('click',()=>{ startScreenShare(); shareMenu.style.display='none'; });
        stopScreenShareBtn.addEventListener('click',stopMyScreenShare);
        fullscreenBtn.addEventListener('click',()=>{ const v=remoteScreenVideo; if(v.requestFullscreen) v.requestFullscreen(); else if(v.webkitEnterFullscreen) v.webkitEnterFullscreen(); });
        messageInput.addEventListener('keypress',e=>{ if(e.key==='Enter' && !messageInput.disabled){ sendChatMessage(messageInput.value); messageInput.value=''; } });
        retryManualBtnInfo.addEventListener('click',()=>{ if(isHost){ if(peer)peer.destroy(); hostConnections.clear(); clientAcks.clear(); hostMessageMap.clear(); hostSession(); } else { manualRetry=true; isConnecting=false; clearTimeouts(); if(peer)peer.destroy(); clientConn=null; currentProfileIndex=parseInt(iceProfileSelectInfo.value,10)||0; attemptConnection(); } });
        qualitySelectInfo.addEventListener('change',e=>requestQualityChange(e.target.value));
        voiceQualitySelect.addEventListener('change',e=>{ voiceQuality=e.target.value; if(localVoiceStream) applyVoiceQualityToStream(localVoiceStream); appendSystemMessage(`🎤 Voice quality set to ${voiceQuality}`); });
        voiceChatBtn.addEventListener('click',()=>toggleVoicePTT());
        menuBtn.addEventListener('click',e=>{ e.stopPropagation(); shareMenu.style.display=shareMenu.style.display==='flex'?'none':'flex'; });
        document.addEventListener('click',e=>{ if(!menuBtn.contains(e.target) && !shareMenu.contains(e.target)) shareMenu.style.display='none'; });
        infoToggleBtn.addEventListener('click',()=>{ infoPanel.style.display=infoPanel.style.display==='flex'?'none':'flex'; });
        
        function initFromUrl(){ const urlSession=getUrlParam('session'); if(urlSession){ sessionId=urlSession; preChatSection.classList.add('hidden'); chatInterface.classList.remove('hidden'); roomLinkDisplayInfo.innerText=buildSessionUrl(sessionId); usernameInput.value='Guest_'+Math.random().toString(36).substring(2,6); myUsername=usernameInput.value; topBarUsername.innerText=myUsername; startClientConnection(); } else { preChatSection.classList.remove('hidden'); chatInterface.classList.add('hidden'); } }
        initFromUrl();
        setInterval(()=>{ if(isHost) updatePeerCountUI(); },1000);
    })();
</script>
</body>
</html>
